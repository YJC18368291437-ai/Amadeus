# Copy to amadeus.local.yml (gitignored), then set your own credentials.
username: amadeus
password: CHANGE-ME
host: 127.0.0.1
port: 3080
sessionHours: 12
# Linux: extract the community DocumentServer package without installing services.
# Standalone trial Builder releases can watermark PDFs; see README.
onlyOfficeMode: native
onlyOfficeBuilder: /opt/amadeus/vendor/onlyoffice/var/www/onlyoffice/documentserver/server/FileConverter/bin/docbuilder
# Optional Docker mode: runs just the builder, no editor service or exposed port.
# onlyOfficeMode: docker
# onlyOfficeImage: onlyoffice/documentserver@sha256:3ab6ebc7c605e5a32b7ae3ff19daed4925090245acc8100ce2230bd766c88212
# onlyOfficeFontsDir: /srv/amadeus/fonts
previewWorkers: 1
previewTimeoutMs: 120000
# Bump after upgrading native Builder or replacing fonts to invalidate old PDFs.
previewCacheVersion: '1'
# Default home: <project>/.amadeus/dsh-home; cache remains <home>/preview-cache.
# home: /srv/amadeus/data
# Optional default workspace for new sessions (must already exist):
# workspace: /srv/amadeus-workspace
maxUploadBytes: 1073741824
maxPreviewBytes: 536870912
# Maximum editable UTF-8 text file size (5 MiB).
maxTextBytes: 5242880
# Optional TeX Live lookup executable for LaTeX packages not bundled with Amadeus.
# kpsewhich: /usr/bin/kpsewhich
