# Copy to cofolio.local.yml (gitignored), then set your own credentials.
username: cofolio
password: CHANGE-ME
host: 127.0.0.1
port: 3080
sessionHours: 12
# Linux: extract the community DocumentServer package without installing services.
# Standalone trial Builder releases can watermark PDFs; see README.
onlyOfficeMode: native
onlyOfficeBuilder: /opt/cofolio-onlyoffice/var/www/onlyoffice/documentserver/server/FileConverter/bin/docbuilder
# Optional Docker mode: runs just the builder, no editor service or exposed port.
# onlyOfficeMode: docker
# onlyOfficeImage: onlyoffice/documentserver@sha256:3ab6ebc7c605e5a32b7ae3ff19daed4925090245acc8100ce2230bd766c88212
# onlyOfficeFontsDir: /srv/cofolio/fonts
previewWorkers: 1
previewTimeoutMs: 120000
# Bump after upgrading native Builder or replacing fonts to invalidate old PDFs.
previewCacheVersion: '1'
# Default home: <project>/.cofolio/dsh-home; cache remains <home>/preview-cache.
# home: /srv/cofolio/data
# Optional default workspace for new sessions (must already exist):
# workspace: /srv/cofolio-workspace
maxUploadBytes: 1073741824
maxPreviewBytes: 104857600
